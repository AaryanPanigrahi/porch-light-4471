<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wake PC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wake PC">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #238636;
    --accent-hover: #2ea043;
    --accent-active: #196f3d;
    --danger: #f85149;
    --border: #30363d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 20px;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0; color: var(--muted); }
  #wakeBtn {
    width: min(70vw, 220px); height: min(70vw, 220px);
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1.3rem; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 0 0 0 rgba(35,134,54,0.5);
    transition: background 0.15s, transform 0.1s;
  }
  #wakeBtn:active { transform: scale(0.96); background: var(--accent-active); }
  #wakeBtn:disabled { background: #30363d; color: var(--muted); cursor: not-allowed; }
  #wakeBtn.pulse {
    animation: pulse 1s ease-out;
  }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(35,134,54,0.6); }
    100% { box-shadow: 0 0 0 30px rgba(35,134,54,0); }
  }
  #status {
    font-size: 0.85rem; color: var(--muted);
    display: flex; align-items: center; gap: 8px;
  }
  #dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--danger);
    transition: background 0.3s;
  }
  #dot.connected { background: var(--accent-hover); }
  #log {
    font-size: 0.75rem; color: var(--muted);
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <h1>Wake-on-LAN</h1>
  <button id="wakeBtn" disabled>Connecting...</button>
  <div id="status"><span id="dot"></span><span id="statusText">Connecting to broker...</span></div>
  <div id="log"></div>

  <script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
  <script src="config.js"></script>
  <script>
    // WAKE_CONFIG comes from config.js (gitignored - copy config.example.js to create it)
    const { MQTT_HOST, MQTT_WSS_PORT, MQTT_USER, MQTT_PASS, WAKE_TOPIC, WAKE_PAYLOAD } = WAKE_CONFIG;

    const btn = document.getElementById('wakeBtn');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const log = document.getElementById('log');

    function setLog(msg) {
      log.textContent = msg;
      setTimeout(() => { if (log.textContent === msg) log.textContent = ''; }, 3000);
    }

    const client = mqtt.connect(`wss://${MQTT_HOST}:${MQTT_WSS_PORT}/mqtt`, {
      username: MQTT_USER,
      password: MQTT_PASS,
      clientId: 'wake-btn-' + Math.random().toString(16).slice(2, 10),
      reconnectPeriod: 3000,
      connectTimeout: 8000,
    });

    client.on('connect', () => {
      dot.classList.add('connected');
      statusText.textContent = 'Connected';
      btn.disabled = false;
      btn.textContent = 'Wake PC';
    });

    client.on('reconnect', () => {
      dot.classList.remove('connected');
      statusText.textContent = 'Reconnecting...';
      btn.disabled = true;
      btn.textContent = 'Connecting...';
    });

    client.on('offline', () => {
      dot.classList.remove('connected');
      statusText.textContent = 'Offline';
      btn.disabled = true;
    });

    client.on('error', (err) => {
      statusText.textContent = 'Connection error';
      setLog(err.message || 'MQTT error');
    });

    btn.addEventListener('click', () => {
      if (!client.connected) return;
      client.publish(WAKE_TOPIC, WAKE_PAYLOAD, { qos: 1 }, (err) => {
        if (err) {
          setLog('Publish failed: ' + err.message);
        } else {
          setLog('Sent ' + new Date().toLocaleTimeString());
        }
      });
      btn.classList.remove('pulse');
      void btn.offsetWidth; // restart animation
      btn.classList.add('pulse');
      if (navigator.vibrate) navigator.vibrate(40);
    });
  </script>
</body>
</html>
