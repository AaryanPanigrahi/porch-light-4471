<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Wake PC</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wake PC">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --text: #c9d1d9;
    --muted: #8b949e;
    --accent: #238636;
    --accent-active: #196f3d;
    --danger: #f85149;
    --border: #30363d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  }
  body {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; gap: 20px;
  }
  h1 { font-size: 1.1rem; font-weight: 600; margin: 0; color: var(--muted); }
  #wakeBtn {
    width: min(70vw, 220px); height: min(70vw, 220px);
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 1.3rem; font-weight: 700;
    cursor: pointer;
  }
  #wakeBtn:active { background: var(--accent-active); }
  #wakeBtn:disabled { background: #30363d; color: var(--muted); cursor: not-allowed; }
  #log { font-size: 0.8rem; color: var(--muted); min-height: 1.2em; }

  /* Login overlay: covers everything, so there is no path to the button
     without a valid session - it isn't just visually on top, the button
     stays disabled underneath until a token exists. */
  #loginOverlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 10;
  }
  #loginOverlay.hidden { display: none; }
  #loginForm {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 20px; width: min(90vw, 280px);
    display: flex; flex-direction: column; gap: 10px;
  }
  #loginForm input {
    padding: 9px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-size: 0.95rem; width: 100%;
  }
  #loginForm button {
    padding: 9px; border-radius: 6px; border: none;
    background: var(--accent); color: white; font-weight: 600; cursor: pointer;
  }
  #loginError { font-size: 0.8rem; color: var(--danger); min-height: 1em; }
  .pwRow { position: relative; display: flex; }
  .pwRow input { padding-right: 36px; }
  #togglePw {
    position: absolute; right: 2px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted); cursor: pointer;
    font-size: 1rem; padding: 6px 8px; line-height: 1;
  }
</style>
</head>
<body>
  <h1>Wake-on-LAN</h1>
  <button id="wakeBtn" disabled>Wake PC</button>
  <div id="log"></div>

  <div id="loginOverlay">
    <form id="loginForm">
      <input id="username" type="text" placeholder="Username" autocomplete="username"
             autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
      <div class="pwRow">
        <input id="password" type="password" placeholder="Password" autocomplete="current-password"
               autocapitalize="off" autocorrect="off" spellcheck="false" required>
        <button type="button" id="togglePw" aria-label="Show password">👁</button>
      </div>
      <button type="submit">Log in</button>
      <div id="loginError"></div>
    </form>
  </div>

  <script src="config.js"></script>
  <script>
    const { WORKER_URL } = WAKE_CONFIG;
    const TOKEN_KEY = 'wake_button_token';

    const btn = document.getElementById('wakeBtn');
    const log = document.getElementById('log');
    const overlay = document.getElementById('loginOverlay');
    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const togglePw = document.getElementById('togglePw');
    const passwordInput = document.getElementById('password');

    togglePw.addEventListener('click', () => {
      const show = passwordInput.type === 'password';
      passwordInput.type = show ? 'text' : 'password';
      togglePw.textContent = show ? '🙈' : '👁';
    });

    function setLog(msg, holdMs = 4000) {
      log.textContent = msg;
      setTimeout(() => { if (log.textContent === msg) log.textContent = ''; }, holdMs);
    }

    function getToken() {
      return localStorage.getItem(TOKEN_KEY);
    }
    function setToken(token) {
      localStorage.setItem(TOKEN_KEY, token);
    }
    function clearToken() {
      localStorage.removeItem(TOKEN_KEY);
    }

    function showLogin() {
      btn.disabled = true;
      overlay.classList.remove('hidden');
    }
    function showButton() {
      overlay.classList.add('hidden');
      btn.disabled = false;
    }

    // Button only unlocks once a token exists locally - but the real gate is
    // server-side: /button/wake rejects any request without a valid token,
    // so there's no way to trigger the wake without having logged in.
    if (getToken()) {
      showButton();
    } else {
      showLogin();
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      loginError.textContent = '';
      const username = document.getElementById('username').value.trim();
      const password = passwordInput.value;
      try {
        const res = await fetch(`${WORKER_URL}/button/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (!res.ok) {
          loginError.textContent = 'Wrong username or password';
          return;
        }
        const { access_token } = await res.json();
        setToken(access_token);
        showButton();
      } catch (err) {
        loginError.textContent = 'Login request failed';
      }
    });

    btn.addEventListener('click', async () => {
      const token = getToken();
      if (!token) { showLogin(); return; }

      btn.disabled = true;
      setLog('Sending...');
      try {
        const res = await fetch(`${WORKER_URL}/button/wake`, {
          method: 'POST',
          headers: { 'Authorization': `Bearer ${token}` },
        });
        if (res.status === 401) {
          clearToken();
          showLogin();
          return;
        }
        const data = await res.json();
        setLog(data.acked ? 'ESP confirmed receipt ✓' : 'Sent, but no confirmation from ESP - it may be offline or stuck', 5000);
      } catch (err) {
        setLog('Request failed');
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
